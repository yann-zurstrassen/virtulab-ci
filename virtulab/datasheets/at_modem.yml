part: "AT-command modem"
manufacturer: "Generic (SIMCom, Quectel, u-blox and others)"
title: "Generic AT-command cellular modem"
document: "ITU-T V.250 (AT command basics) and 3GPP TS 27.007 (cellular commands); each module's AT manual lists what it supports"
product_page: ""
interface: "UART, 115200 baud, 8N1, commands end with CR"
rows:
  - topic: "Command line"
    datasheet: "A command starts with AT and ends with CR."
    status: modelled
    model: "devices/ATModem.cs#if(value == (byte)'\\r')"
    driver: "templates/starter/at_modem/src/modem.c#uart_write(MODEM_PORT, (const uint8_t *)command"
    test: "templates/starter/at_modem/test/test_modem.c#test_modem_starts_and_turns_echo_off"
  - topic: "Result codes"
    datasheet: "A reply is zero or more information lines, then OK or ERROR, each framed by CR LF."
    status: modelled
    model: "devices/ATModem.cs#var final = \"OK\";"
    driver: "templates/starter/at_modem/src/modem.c#A final result code ends the answer"
    test: "templates/starter/at_modem/test/test_modem.c#test_modem_reports_error_and_silence"
  - topic: "Command echo"
    datasheet: "Echo is on at power-up (the modem repeats what it receives); ATE0 turns it off, ATE1 on."
    status: modelled
    model: "devices/ATModem.cs#case \"ATE0\":"
    driver: "templates/starter/at_modem/src/modem.c#Echo is on at power-up"
    test: "templates/starter/at_modem/test/test_modem.c#test_modem_starts_and_turns_echo_off"
  - topic: "Signal quality: AT+CSQ"
    datasheet: "+CSQ: <rssi>,<ber>. rssi 0 is −113 dBm or less, 1 is −111 dBm, 2 to 30 are −109 to −53 dBm, 31 is −51 dBm or more, 99 is not known."
    status: modelled
    model: "devices/ATModem.cs#Reply(\"+CSQ: \""
    driver: "templates/starter/at_modem/src/modem.c#*dbm = -113 + 2 * rssi;"
    test: "templates/starter/at_modem/test/test_modem.c#test_modem_signal_strength_in_dbm"
  - topic: "Unknown signal (99)"
    datasheet: "rssi 99 means not known or not detectable, not a signal level."
    status: modelled
    model: "devices/ATModem.cs#public int Signal"
    driver: "templates/starter/at_modem/src/modem.c#if (rssi == 99) {"
    test: "templates/starter/at_modem/test/test_modem.c#test_modem_unknown_signal_is_not_a_number"
  - topic: "Registration: AT+CREG?"
    datasheet: "+CREG: <n>,<stat>. stat 0 not registered, 1 registered (home), 2 searching, 3 denied, 4 unknown, 5 registered (roaming)."
    status: modelled
    model: "devices/ATModem.cs#Reply(\"+CREG: 0,\""
    driver: "templates/starter/at_modem/src/modem.c#(stat == 1 || stat == 5)"
    test: "templates/starter/at_modem/test/test_modem.c#test_modem_registration_states"
  - topic: "SIM state: AT+CPIN?"
    datasheet: "+CPIN: READY when the SIM can be used; +CPIN: SIM PIN when it waits for its PIN."
    status: modelled
    model: "devices/ATModem.cs#+CPIN: SIM PIN"
    driver: "templates/starter/at_modem/src/modem.c#modem_status_t modem_sim_ready"
    test: "templates/starter/at_modem/test/test_modem.c#test_modem_sim_that_needs_a_pin"
  - topic: "Manufacturer: AT+CGMI"
    datasheet: "Returns the manufacturer's name."
    status: modelled
    model: "devices/ATModem.cs#Reply(\"VirtuLab\");"
    test: "templates/starter/at_modem/test/test_modem.c#test_modem_starts_and_turns_echo_off"
  - topic: "Unknown command"
    datasheet: "A command the modem does not know is answered with ERROR."
    status: modelled
    model: "devices/ATModem.cs#default:"
    driver: "templates/starter/at_modem/src/modem.c#return MODEM_ERR_ERROR;"
    test: "templates/starter/at_modem/test/test_modem.c#test_modem_reports_error_and_silence"
  - topic: "Baud rate"
    datasheet: "Many modems start at 115200 baud, others autodetect."
    status: simplified
    model: "devices/ATModem.cs#public uint BaudRate => 115200;"
    driver: "templates/starter/at_modem/src/modem.c#define MODEM_BAUD"
    note: "The emulator does not pace bytes by baud rate, so a wrong baud rate is not caught."
  - topic: "No answer"
    datasheet: "(Not in the datasheet.) An unpowered modem, or one held in reset, does not answer."
    status: modelled
    model: "devices/ATModem.cs#public bool Silent"
    driver: "templates/starter/at_modem/src/modem.c#return MODEM_ERR_TIMEOUT;"
    test: "templates/starter/at_modem/test/test_modem.c#test_modem_reports_error_and_silence"
    note: "VirtuLab fault injection: Silent, and Failing (every command answers ERROR)."
  - topic: "Data connections, SMS and sockets"
    datasheet: "PPP, TCP/IP stacks, SMS (AT+CMGS) and similar."
    status: not-modelled
  - topic: "Unsolicited result codes, error codes and power commands"
    datasheet: "RING, +CREG changes and similar messages the modem sends by itself; +CME ERROR numbers; AT+CFUN power states."
    status: not-modelled
  - topic: "Network timing and flow control"
    datasheet: "Commands such as network search take seconds; RTS/CTS flow control."
    status: not-modelled
    note: "Every reply comes at once."
