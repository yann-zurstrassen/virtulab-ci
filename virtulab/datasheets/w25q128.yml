part: "W25Q128"
manufacturer: "Winbond"
title: "Winbond W25Q128 SPI flash (16 MiB)"
product_page: "https://www.winbond.com/hq/product/code-storage-flash-memory/serial-nor-flash/"
interface: "SPI, mode 0 (mode 3 also works), standard single-bit instructions"
documents:
  - id: "w25q128-ds"
    title: "Winbond W25Q128JV datasheet"
    revision: "Revision F, 27 March 2018"
    kind: "datasheet"
    url: "https://www.winbond.com/resource-files/w25q128jv%20revf%2003272018%20plus.pdf"
    retrieved: "2026-10-30"
    sha256: "809f066e62bcde10b12c2202daf05f4776929ad7dc5f9d3b5131cdcc84502bc1"
rows:
  - topic: "JEDEC ID"
    datasheet: "Instruction 0x9F returns the manufacturer 0xEF, memory type 0x40 and capacity 0x18."
    source: "w25q128-ds §8.1.1, p. 22"
    status: modelled
    model: "devices/W25Q128.cs#JedecId = { 0xEF, 0x40, 0x18 }"
    driver: "templates/starter/w25q128/src/w25q128.c#rx[1] == 0xEF"
    test: "templates/starter/w25q128/test/test_w25q128.c#test_w25q128_identifies_itself"
  - topic: "Status register: BUSY and WEL"
    datasheet: "Instruction 0x05 reads status register 1: bit 0 BUSY while a program or erase runs, bit 1 WEL (write enable latch)."
    source: "w25q128-ds §7.1.1, §7.1.2, p. 14"
    status: modelled
    model: "devices/W25Q128.cs#(busy > 0 ? 0x01 : 0x00)"
    driver: "templates/starter/w25q128/src/w25q128.c#define STATUS_BUSY"
    test: "templates/starter/w25q128/test/test_w25q128.c#test_w25q128_waits_while_the_chip_is_busy"
  - topic: "Write enable"
    datasheet: "Page program and erase are ignored unless instruction 0x06 set WEL first; WEL clears when they finish."
    source: "w25q128-ds §8.2.1, p. 25"
    status: modelled
    model: "devices/W25Q128.cs#write enable was not sent first"
    driver: "templates/starter/w25q128/src/w25q128.c#static w25q128_status_t write_enable"
  - topic: "Read data"
    datasheet: "Instruction 0x03, a 24-bit address, then data; the address increments for as long as the clock runs."
    source: "w25q128-ds §8.2.6, p. 29"
    status: modelled
    model: "devices/W25Q128.cs#case ReadData:"
    driver: "templates/starter/w25q128/src/w25q128.c#define CMD_READ"
    test: "templates/starter/w25q128/test/test_w25q128.c#test_w25q128_programmed_data_reads_back"
  - topic: "Page program"
    datasheet: "Instruction 0x02, a 24-bit address, then up to 256 bytes. If more bytes arrive than fit before the page end, the address wraps to the start of the same page."
    source: "w25q128-ds §8.1.2 note, p. 24"
    status: modelled
    model: "devices/W25Q128.cs#memory[page + ((offset + i) & 0xFF)] &= pending[i];"
    driver: "templates/starter/w25q128/src/w25q128.c#one program instruction must stay inside a page"
    test: "templates/starter/w25q128/test/test_w25q128.c#test_w25q128_write_across_a_page_boundary"
  - topic: "Programming only clears bits"
    datasheet: "A program operation can change bits from 1 to 0 only; setting bits back to 1 needs an erase."
    source: "w25q128-ds §8.2.13, p. 37"
    status: modelled
    model: "devices/W25Q128.cs#&= pending[i]"
    driver: "templates/starter/w25q128/include/w25q128.h#A byte can only change from 1 to 0"
    test: "templates/starter/w25q128/test/test_w25q128.c#test_w25q128_programming_can_only_clear_bits"
  - topic: "Sector erase"
    datasheet: "Instruction 0x20 with an address erases the 4 KiB sector that contains it to 0xFF."
    source: "w25q128-ds §8.2.15, p. 39"
    status: modelled
    model: "devices/W25Q128.cs#EraseRange(address & ~0xFFFu, 0x1000);"
    driver: "templates/starter/w25q128/src/w25q128.c#define CMD_SECTOR_ERASE"
    test: "templates/starter/w25q128/test/test_w25q128.c#test_w25q128_erased_flash_reads_ff"
  - topic: "Block and chip erase"
    datasheet: "Instruction 0xD8 erases a 64 KiB block; 0xC7 or 0x60 erases the whole chip."
    source: "w25q128-ds p. 5"
    status: modelled
    model: "devices/W25Q128.cs#EraseRange(address & ~0xFFFFu, 0x10000);"
    note: "Not used by the sample driver."
  - topic: "Instructions are ignored while busy"
    datasheet: "While BUSY is set the chip accepts only a few instructions (reading the status registers, suspend)."
    source: "w25q128-ds §7.1.1, p. 14"
    status: modelled
    model: "devices/W25Q128.cs#the chip ignores everything but"
    driver: "templates/starter/w25q128/src/w25q128.c#w25q128_status_t w25q128_wait_ready"
    test: "templates/starter/w25q128/test/test_w25q128.c#test_w25q128_waits_while_the_chip_is_busy"
  - topic: "Erased state and non-volatile contents"
    datasheet: "An erased chip reads 0xFF, and the contents survive power loss."
    source: "w25q128-ds §8.2.15, p. 39"
    status: modelled
    model: "devices/W25Q128.cs#memory[i] = 0xFF;"
    test: "templates/starter/w25q128/test/test_w25q128.c#test_w25q128_erased_flash_reads_ff"
    note: "The model keeps its contents across a reset, like the real chip."
  - topic: "Program and erase time"
    datasheet: "A page program takes about 0.4 ms, a sector erase about 45 ms (typical)."
    source: "w25q128-ds §9.6, p. 66"
    status: simplified
    model: "devices/W25Q128.cs#public int BusyPolls"
    driver: "templates/starter/w25q128/src/w25q128.c#define READY_POLLS"
    test: "templates/starter/w25q128/test/test_w25q128.c#test_w25q128_gives_up_on_a_chip_that_never_finishes"
    note: "Time is counted in status reads (BusyPolls), not seconds. Operations are instant by default."
  - topic: "Not connected"
    datasheet: "(Not in the datasheet.) A chip that is not connected leaves the line high: every byte reads 0xFF."
    source: "n/a behaviour of a failed or absent part, not a statement of the document"
    status: modelled
    model: "devices/W25Q128.cs#public bool Responding"
    driver: "templates/starter/w25q128/src/w25q128.c#W25Q128_ERR_ID"
    test: "templates/starter/w25q128/test/test_w25q128.c#test_w25q128_detects_a_missing_chip"
  - topic: "Other registers and modes"
    datasheet: "Status registers 2 and 3, write protection, fast read, dual and quad I/O, suspend and resume, power-down, security registers and SFDP."
    source: "w25q128-ds §7.1, p. 14"
    status: not-modelled
  - topic: "SPI mode"
    datasheet: "The chip works in mode 0 and mode 3."
    source: "w25q128-ds §6.1, p. 12"
    status: not-modelled
    driver: "templates/starter/w25q128/include/w25q128.h#define W25Q128_CS"
    note: "The sample driver asks for mode 0, but the emulator does not check the mode."
