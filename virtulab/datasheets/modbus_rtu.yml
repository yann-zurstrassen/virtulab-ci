part: "Modbus RTU slave"
manufacturer: "Generic (RS-485 temperature and humidity transmitters)"
title: "Generic Modbus RTU temperature and humidity transmitter"
product_page: "https://modbus.org/specs.php"
interface: "UART (RS-485 with a transceiver), 9600 baud, 8N1; slave address 1 to 247"
documents:
  - id: "modbus-app"
    title: "MODBUS Application Protocol Specification"
    revision: "V1.1b3"
    kind: "standard"
    url: "https://www.modbus.org/file/secure/modbusprotocolspecification.pdf"
    retrieved: "2026-10-30"
    sha256: "f80d0d7132fd035104c3f21b01026470e3310ca3d8d493d9a9737d0d32ad2eb1"
  - id: "modbus-serial"
    title: "MODBUS over Serial Line Specification and Implementation Guide"
    revision: "V1.02"
    kind: "standard"
    url: "https://www.modbus.org/file/secure/modbusoverserial.pdf"
    retrieved: "2026-10-30"
    sha256: "85a91e278b26d68c94a2f61a5300cd39c9e4c855034833f391abc6541fbdf7e5"
rows:
  - topic: "Frame"
    datasheet: "A request is slave address, function code, data, then a 16-bit CRC sent low byte first."
    source: "modbus-serial p. 8"
    status: modelled
    model: "devices/ModbusRtuSlave.cs#frame.Add((byte)(crc & 0xFF));"
    driver: "templates/starter/modbus/src/modbus.c#out[6] = (uint8_t)crc;"
    test: "templates/starter/modbus/test/test_modbus.c#test_modbus_builds_a_read_request"
  - topic: "CRC-16"
    datasheet: "Polynomial 0xA001 (reflected), initial value 0xFFFF. For 01 03 00 00 00 0A the CRC is sent as C5 CD."
    source: "modbus-serial §2.5.1.2 and Appendix B, p. 15"
    status: modelled
    model: "devices/ModbusRtuSlave.cs#private static int Crc16"
    driver: "templates/starter/modbus/src/modbus.c#uint16_t modbus_crc16"
    test: "templates/starter/modbus/test/test_modbus.c#test_modbus_crc16_matches_the_specification_examples"
  - topic: "Read holding and input registers"
    datasheet: "Functions 0x03 and 0x04: start address and register count (1 to 125); the answer is the function, a byte count and the values, high byte first."
    source: "modbus-app §6.3, p. 15"
    status: modelled
    model: "devices/ModbusRtuSlave.cs#private void ReadRegisters"
    driver: "templates/starter/modbus_rtu/src/modbus_rtu.c#modbus_rtu_status_t modbus_rtu_read_input"
    test: "templates/starter/modbus_rtu/test/test_modbus_rtu.c#test_modbus_rtu_reads_temperature_and_humidity"
  - topic: "Register count limit"
    datasheet: "At most 125 registers per read; 0 and more than 125 are illegal data values."
    source: "modbus-app §6.3, p. 15"
    status: modelled
    model: "devices/ModbusRtuSlave.cs#count > 125"
    driver: "templates/starter/modbus/include/modbus.h#define MODBUS_MAX_REGISTERS"
    test: "templates/starter/modbus/test/test_modbus.c#test_modbus_builds_a_read_request"
  - topic: "Response parsing"
    datasheet: "The answer has the same slave and function, a byte count of twice the register count, the values and the CRC."
    source: "modbus-app §6.3, p. 15"
    status: modelled
    model: "devices/ModbusRtuSlave.cs#new List<byte> { (byte)SlaveAddress, function, (byte)(count * 2) }"
    driver: "templates/starter/modbus/src/modbus.c#modbus_status_t modbus_parse_read"
    test: "templates/starter/modbus/test/test_modbus.c#test_modbus_parses_a_response"
  - topic: "Exception responses"
    datasheet: "A refused request is answered with the function code plus 0x80 and a code: 01 illegal function, 02 illegal data address, 03 illegal data value."
    source: "modbus-app §7, p. 9"
    status: modelled
    model: "devices/ModbusRtuSlave.cs#private void Exception(byte function, byte code)"
    driver: "templates/starter/modbus/src/modbus.c#return MODBUS_ERR_EXCEPTION;"
    test: "templates/starter/modbus_rtu/test/test_modbus_rtu.c#test_modbus_rtu_reports_a_refused_request"
  - topic: "Frames that are ignored"
    datasheet: "A slave does not answer a frame with a wrong CRC or for another address."
    source: "modbus-serial p. 7"
    status: modelled
    model: "devices/ModbusRtuSlave.cs#if(frame[0] != SlaveAddress)"
    driver: "templates/starter/modbus_rtu/src/modbus_rtu.c#return MODBUS_RTU_ERR_TIMEOUT;"
    test: "templates/starter/modbus_rtu/test/test_modbus_rtu.c#test_modbus_rtu_times_out_on_the_wrong_address_or_a_silent_slave"
  - topic: "Write single register"
    datasheet: "Function 0x06: address and value; the slave echoes the request."
    source: "modbus-app §6.6, p. 11"
    status: modelled
    model: "devices/ModbusRtuSlave.cs#private void WriteHolding"
    note: "Not used by the sample driver."
  - topic: "Register map of the transmitter"
    datasheet: "Typical layout (not a specific product): input register 0 humidity in 0.1 %, input register 1 temperature in 0.1 °C as a signed 16-bit value."
    source: "n/a product register layout, not defined by the Modbus specifications"
    status: simplified
    model: "devices/ModbusRtuSlave.cs#private ushort InputRegister"
    driver: "templates/starter/modbus_rtu/src/modbus_rtu.c#0.1 % per step"
    test: "templates/starter/modbus_rtu/test/test_modbus_rtu.c#test_modbus_rtu_reads_negative_temperature"
    note: "Real products place the values elsewhere; the manual of the transmitter you use says where."
  - topic: "Corrupted or missing answer"
    datasheet: "(Not in the datasheet.) A noisy RS-485 line corrupts the CRC; a cut cable or wrong baud rate gives silence."
    source: "n/a behaviour of a failed or absent part, not a statement of the document"
    status: modelled
    model: "devices/ModbusRtuSlave.cs#public bool CorruptCrc"
    driver: "templates/starter/modbus_rtu/src/modbus_rtu.c#return MODBUS_RTU_ERR_CRC;"
    test: "templates/starter/modbus_rtu/test/test_modbus_rtu.c#test_modbus_rtu_refuses_an_answer_with_a_wrong_crc"
    note: "VirtuLab fault injection: CorruptCrc and Silent."
  - topic: "Baud rate and line settings"
    datasheet: "The default parity mode is even (8E1); no parity is an allowed option. 9600 and 19200 bit/s are required, and 19200 is the required default."
    source: "modbus-serial §2.5.1, p. 12"
    issue: "The specification requires 19200 bit/s, even parity as the default. The catalog and sample driver use 9600 8N1, which real transmitters may differ on. The model checks neither baud rate nor parity, so a driver with the wrong line settings still passes."
    status: simplified
    model: "devices/ModbusRtuSlave.cs#public uint BaudRate => 9600;"
    driver: "templates/starter/modbus_rtu/include/modbus_rtu.h#define MODBUS_RTU_BAUD"
    note: "The emulator does not pace bytes by baud rate."
  - topic: "Frame separation by silence"
    datasheet: "A frame ends after 3.5 character times of silence."
    source: "modbus-serial §2.5.1, p. 12"
    status: not-modelled
    note: "The model takes every eight bytes as one request, so a request of another length puts it out of step."
  - topic: "Other functions, broadcast and diagnostics"
    datasheet: "Functions 0x01, 0x02, 0x05, 0x0F, 0x10, 0x17, broadcast address 0 and the diagnostic counters."
    source: "modbus-app §6, p. 11"
    status: not-modelled
    note: "Other functions are answered with exception 01."
