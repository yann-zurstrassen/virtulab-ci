# The demo firmware at the repository root. `make` and CI both run exactly this.
version: 1
board: lm3s6965evb
build:
  sources:
    - src/parser.c
    - src/auth.c
    - src/sensor.c
    - src/hal/sensor_hal_nominal.c
    - examples/crc/src/crc.c
    - test/test_main.c
    - test/test_crc.c
    - test/test_parser.c
    - test/test_auth.c
    - test/test_sensor.c
  include: [include, examples/crc/include]
  cflags: -std=c99 -Wall -Wextra -Werror -Wconversion -ffreestanding
timeout: 30s
tests:
  unit: {}
  footprint: { flash_increase: 4K, ram_increase: 2K }
  coverage:
    sources: [src/parser.c, src/auth.c, src/sensor.c, src/hal/sensor_hal_nominal.c, examples/crc/src/crc.c]
  fuzz:
    harness: fuzz/parser_fuzz.c
    sources: [src/parser.c, examples/crc/src/crc.c]
    include: [include, examples/crc/include]
    seconds: 10
  fault:
    probe: [fault/auth_probe.c, fault/auth_probe_count.c, fault/auth_probe_locked.c]
    sources: [src/auth.c]
    target: src/auth.c
    include: [include]
