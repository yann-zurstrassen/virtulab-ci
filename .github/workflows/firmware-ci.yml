name: VirtuLab CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  pull-requests: write

# The demo firmware (src/, test/, fuzz/, fault/) is checked by the make targets,
# which drive the engine in this repository. The `thermostat` job still runs the
# published-action path (Docker image, Renode). Each make-based job leaves a
# one-line result in .ci/; the `report` job merges them into one sticky comment.
env:
  TOOLS: qemu-system-arm gcc-arm-none-eabi binutils-arm-none-eabi gdb-multiarch
  BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'main' }}
  RUN_ACTION_IMAGE: >-
    docker run --rm
    -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP"
    -w "$GITHUB_WORKSPACE"
    --env-file <(compgen -e | grep -E '^(GITHUB|INPUT|RUNNER)_')
    virtulab

jobs:
  engine-tests:
    name: Engine tests (all boards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the action image
        run: docker build -t virtulab .

      - name: Run unit and end-to-end tests inside the image
        run: >
          docker run --rm -v "$PWD:/src" -w /src --entrypoint python3 virtulab
          -m unittest discover -v -s tests -t .

  build-test:
    name: Build & unit tests (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and emulator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $TOOLS
      - name: make test
        run: make test

  footprint:
    name: Footprint (Flash/RAM vs base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and emulator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $TOOLS
      - name: make footprint
        run: make footprint BASELINE="$BASELINE_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fragment-footprint
          path: .ci/footprint.md
          if-no-files-found: ignore

  coverage:
    name: Coverage (gcov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make coverage
        run: make coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fragment-coverage
          path: .ci/coverage.txt
          if-no-files-found: ignore

  fuzz:
    name: Fuzz parser (60 s, host-side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make fuzz
        run: make fuzz FUZZ_SECONDS=60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fragment-fuzz
          path: |
            .ci/fuzz.txt
            fuzz/crashes/*.crash
          if-no-files-found: ignore

  fault-injection:
    name: Fault injection (single instruction skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain, emulator and GDB
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $TOOLS
      - name: make fault
        run: make fault
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fragment-fault
          path: .ci/fault.txt
          if-no-files-found: ignore

  report:
    name: Sticky PR comment
    needs: [ build-test, footprint, coverage, fuzz, fault-injection ]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fragment-*
          path: .ci
          merge-multiple: true
      - name: Assemble and post the comment
        run: python3 tools/ci_report.py --post
        env:
          GITHUB_TOKEN: ${{ github.token }}

  thermostat:
    name: Emulate STM32F4 + I2C sensor (examples/thermostat, Renode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the action image
        run: docker build -t virtulab .

      - name: Run VirtuLab CI
        shell: bash
        run: eval "$RUN_ACTION_IMAGE"
        env:
          INPUT_WORKING_DIRECTORY: examples/thermostat
          INPUT_BOARD: stm32f4_discovery
          INPUT_SOURCES: |
            src/*.c
            test/*.c
          INPUT_INCLUDE_DIRS: include
          INPUT_PERIPHERALS: board.repl
          INPUT_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_REPORT_ID: thermostat
