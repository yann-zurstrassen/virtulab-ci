part: "MPU-6050"
manufacturer: "InvenSense (TDK)"
title: "InvenSense MPU-6050 6-axis motion sensor"
product_page: "https://invensense.tdk.com/products/motion-tracking/6-axis/mpu-6050/"
interface: "I²C, address 0x68 (AD0 low) or 0x69 (AD0 high)"
documents:
  - id: "mpu-ps"
    title: "InvenSense MPU-6000/6050 product specification"
    revision: "PS-MPU-6000A-00 v3.1"
    kind: "datasheet"
    url: "https://cdn.sparkfun.com/datasheets/Components/General%20IC/PS-MPU-6000A.pdf"
    retrieved: "2026-10-30"
    sha256: "7e87555c386d880a3db2ec2718df57e59de9105a0e5e4531ed96707df15678b4"
  - id: "mpu-rm"
    title: "InvenSense MPU-6000/6050 register map"
    revision: "RM-MPU-6000A-00"
    kind: "register map"
    url: "https://cdn.sparkfun.com/datasheets/Sensors/Accelerometers/RM-MPU-6000A.pdf"
    retrieved: "2026-10-30"
    sha256: "ccaa6312b9d86a9da79e26e511101e1150dc85a48255600010a854369cf7c05d"
rows:
  - topic: "I²C address"
    datasheet: "The AD0 pin selects 0x68 or 0x69."
    source: "mpu-ps p. 15"
    status: modelled
    model: "catalog.py#addresses=(0x68, 0x69)"
    driver: "templates/starter/mpu6050/include/mpu6050.h#define MPU6050_ADDR"
  - topic: "WHO_AM_I"
    datasheet: "Register 0x75 reads 0x68, whatever AD0 is."
    source: "mpu-rm p. 8"
    status: modelled
    model: "devices/MPU6050.cs#return 0x68;"
    driver: "templates/starter/mpu6050/include/mpu6050.h#define MPU6050_WHO_AM_I_VALUE"
    test: "templates/starter/mpu6050/test/test_mpu6050.c#test_mpu6050_identifies_itself"
  - topic: "Sleep at power-up"
    datasheet: "PWR_MGMT_1 (0x6B) resets to 0x40: the SLEEP bit is set. Clear it to start measuring."
    source: "mpu-rm §3, p. 8"
    status: modelled
    model: "devices/MPU6050.cs#registers[PowerManagement1] = 0x40;"
    driver: "templates/starter/mpu6050/src/mpu6050.c#PWR_MGMT_1 resets to 0x40"
    test: "templates/starter/mpu6050/test/test_mpu6050.c#test_mpu6050_must_be_woken_from_sleep"
    note: "While asleep the model returns zero in the data registers."
  - topic: "Data register layout"
    datasheet: "0x3B to 0x40 accelerometer X, Y, Z; 0x41 and 0x42 temperature; 0x43 to 0x48 gyroscope X, Y, Z. Each value is 16 bits, two's complement, high byte first."
    source: "mpu-rm §3, register map, p. 7"
    status: modelled
    model: "devices/MPU6050.cs#Layout from 0x3B"
    driver: "templates/starter/mpu6050/include/mpu6050.h#define MPU6050_REG_ACCEL_OUT"
    test: "templates/starter/mpu6050/test/test_mpu6050.c#test_mpu6050_reads_negative_acceleration_and_rotation"
  - topic: "Burst read"
    datasheet: "The register address increments after each byte read, so one read returns all 14 bytes."
    source: "mpu-ps p. 38"
    status: modelled
    model: "devices/MPU6050.cs#result[i] = ReadRegister(pointer);"
    driver: "templates/starter/mpu6050/src/mpu6050.c#uint8_t raw[14];"
    test: "templates/starter/mpu6050/test/test_mpu6050.c#test_mpu6050_measures_gravity"
  - topic: "Accelerometer scale"
    datasheet: "ACCEL_CONFIG (0x1C) bits 4 and 3: ±2, ±4, ±8, ±16 g at 16384, 8192, 4096, 2048 counts per g."
    source: "mpu-rm §4.17, p. 30"
    status: modelled
    model: "devices/MPU6050.cs#16384 >> ((registers[AccelConfig] >> 3) & 0x3)"
    driver: "templates/starter/mpu6050/src/mpu6050.c#16384 >> accel_range"
    test: "templates/starter/mpu6050/test/test_mpu6050.c#test_mpu6050_accelerometer_range_changes_the_scale"
  - topic: "Gyroscope scale"
    datasheet: "GYRO_CONFIG (0x1B) bits 4 and 3: ±250, ±500, ±1000, ±2000 °/s at 131, 65.5, 32.8, 16.4 counts per °/s."
    source: "mpu-rm §4.19, p. 32"
    status: modelled
    model: "devices/MPU6050.cs#GyroCountsPerDegree = { 131m, 65.5m, 32.8m, 16.4m }"
    driver: "templates/starter/mpu6050/src/mpu6050.c#131 counts per deg/s"
    test: "templates/starter/mpu6050/test/test_mpu6050.c#test_mpu6050_reads_negative_acceleration_and_rotation"
    note: "The sample driver only uses ±250 °/s; the other ranges are modelled but not exercised."
  - topic: "Temperature"
    datasheet: "Temperature in °C = TEMP_OUT / 340 + 36.53."
    source: "mpu-rm §4.18, p. 31"
    status: modelled
    model: "devices/MPU6050.cs#(Temperature - 36.53m) * 340m"
    driver: "templates/starter/mpu6050/src/mpu6050.c#TEMP_OUT / 340 + 36.53"
    test: "templates/starter/mpu6050/test/test_mpu6050.c#test_mpu6050_converts_temperature_with_the_datasheet_formula"
  - topic: "Read-only registers"
    datasheet: "WHO_AM_I and the sensor data registers cannot be written."
    source: "mpu-rm §3, register map, p. 8"
    status: modelled
    model: "devices/MPU6050.cs#Write to read-only register"
  - topic: "Sample rate, filter, FIFO and interrupts"
    datasheet: "SMPLRT_DIV, CONFIG (low-pass filter), FIFO_EN, INT_ENABLE and related registers."
    source: "mpu-rm §4.2 to §4.16, p. 11"
    status: not-modelled
    note: "They store what is written and do nothing; data is always current."
  - topic: "Auxiliary I²C master, self-test and other power modes"
    datasheet: "The chip can read external sensors, run a self-test and use cycle or standby modes."
    source: "mpu-rm §4.8, p. 17"
    status: not-modelled
