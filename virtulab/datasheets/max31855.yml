part: "MAX31855"
manufacturer: "Maxim Integrated (Analog Devices)"
title: "Maxim MAX31855 thermocouple converter"
product_page: "https://www.analog.com/en/products/max31855.html"
interface: "SPI, read only, mode 0 (the chip has no input)"
documents:
  - id: "max31855-ds"
    title: "Maxim MAX31855 datasheet"
    revision: "19-5793 Rev 2, 2/12"
    kind: "datasheet"
    url: "https://cdn-shop.adafruit.com/datasheets/MAX31855.pdf"
    retrieved: "2026-10-30"
    sha256: "45904b81e79c46af49fd5c880df7ec04678c8599be9df73cea8422d241ceb7a2"
rows:
  - topic: "32-bit frame"
    datasheet: "A read clocks out 32 bits, most significant first: thermocouple temperature, fault bit, cold-junction temperature, fault flags."
    source: "max31855-ds Serial Interface, Table 2, p. 10"
    status: modelled
    model: "devices/MAX31855.cs#var frame = (thermocouple << 18) | (internalJunction << 4);"
    driver: "templates/starter/max31855/src/max31855.c#uint32_t frame ="
    test: "templates/starter/max31855/test/test_max31855.c#test_max31855_reads_both_temperatures"
  - topic: "Thermocouple temperature"
    datasheet: "Bits 31 to 18: 14-bit two's complement, 0.25 °C per count."
    source: "max31855-ds Table 3, p. 10"
    status: modelled
    model: "devices/MAX31855.cs#ThermocoupleTemperature / 0.25m"
    driver: "templates/starter/max31855/src/max31855.c#bits 31..18: 14-bit two's complement"
    test: "templates/starter/max31855/test/test_max31855.c#test_max31855_reads_negative_temperatures"
  - topic: "Cold-junction temperature"
    datasheet: "Bits 15 to 4: 12-bit two's complement, 0.0625 °C per count."
    source: "max31855-ds Table 2, p. 10"
    status: modelled
    model: "devices/MAX31855.cs#InternalTemperature / 0.0625m"
    driver: "templates/starter/max31855/src/max31855.c#bits 15..4: 12-bit two's complement"
    test: "templates/starter/max31855/test/test_max31855.c#test_max31855_reads_both_temperatures"
  - topic: "Fault bit"
    datasheet: "Bit 16 is set when any of the three fault flags is set."
    source: "max31855-ds Table 3, p. 10"
    status: modelled
    model: "devices/MAX31855.cs#frame |= 1u << 16;"
    driver: "templates/starter/max31855/src/max31855.c#fault bit: bits 2..0 say which"
    test: "templates/starter/max31855/test/test_max31855.c#test_max31855_reports_each_fault"
  - topic: "Fault flags"
    datasheet: "Bit 0 OC (thermocouple open), bit 1 SCG (shorted to ground), bit 2 SCV (shorted to VCC)."
    source: "max31855-ds Serial Interface, p. 9"
    status: modelled
    model: "devices/MAX31855.cs#if(OpenCircuit)"
    driver: "templates/starter/max31855/src/max31855.c#return MAX31855_ERR_OPEN;"
    test: "templates/starter/max31855/test/test_max31855.c#test_max31855_reports_each_fault"
    note: "VirtuLab fault injection: OpenCircuit, ShortToGround and ShortToVcc."
  - topic: "Reserved bits"
    datasheet: "Bits 17 and 3 always read 0."
    source: "max31855-ds Table 3, p. 10"
    status: modelled
    model: "devices/MAX31855.cs#bit  17      reserved, 0"
  - topic: "A read ends when chip select goes high"
    datasheet: "Taking CS high ends the read; the next read starts at bit 31 again."
    source: "max31855-ds Serial Interface, p. 9"
    status: modelled
    model: "devices/MAX31855.cs#public void FinishTransmission()"
    driver: "templates/starter/spi/src/spi.c#cs_set(dev, 0);"
  - topic: "Not connected"
    datasheet: "(Not in the datasheet.) A chip that is not connected leaves the line high: every bit reads 1."
    source: "n/a behaviour of a failed or absent part, not a statement of the document"
    status: modelled
    model: "devices/MAX31855.cs#public bool Responding"
    driver: "templates/starter/max31855/src/max31855.c#return MAX31855_ERR_NO_DEVICE;"
    test: "templates/starter/max31855/test/test_max31855.c#test_max31855_detects_a_disconnected_chip"
  - topic: "SPI mode"
    datasheet: "The chip is read in mode 0."
    source: "max31855-ds Serial Interface, p. 9"
    status: not-modelled
    driver: "templates/starter/max31855/include/max31855.h#define MAX31855_CS"
    note: "The sample driver asks for mode 0, but the emulator does not check the mode."
  - topic: "Conversion time and the other thermocouple types"
    datasheet: "A conversion takes about 70 ms. The MAX31855K is for K-type; other variants cover T, J, N, S and E with other ranges."
    source: "max31855-ds Electrical characteristics, p. 4"
    status: not-modelled
    note: "The value is current. Only the K-type range is assumed (the frame itself is the same for all variants)."
