part: "SHT31"
manufacturer: "Sensirion"
title: "Sensirion SHT31 temperature and humidity sensor"
product_page: "https://sensirion.com/products/catalog/SHT31-DIS-B"
interface: "I²C, address 0x44 (ADDR low) or 0x45 (ADDR high)"
documents:
  - id: "sht3x-ds"
    title: "Sensirion SHT3x-DIS datasheet"
    revision: "Version 7, December 2022"
    kind: "datasheet"
    url: "https://sensirion.com/media/documents/213E6A3B/63A5A569/Datasheet_SHT3x_DIS.pdf"
    retrieved: "2026-10-30"
    sha256: "095b1853e7f4328f5897c9ca6c392a7dd8b0202eda66b0a2629f9cb840dd496d"
  - id: "sensirion-driver"
    title: "Sensirion embedded-i2c-sht3x driver, sht3x_i2c.c (vendored)"
    revision: "see examples/sensirion-sht3x/vendor/sensirion/VENDORED.md"
    kind: "vendor driver"
    url: "https://github.com/Sensirion/embedded-i2c-sht3x"
    retrieved: "2026-10-30"
    sha256: "a7fb72d7f7e53062c91db77817481c774f6ab79d5d7605f1e9eac3a30888263e"
rows:
  - topic: "I²C address"
    datasheet: "The ADDR pin selects 0x44 or 0x45."
    source: "sht3x-ds §3.4, Table 8, p. 9"
    status: modelled
    model: "catalog.py#addresses=(0x44, 0x45)"
    driver: "templates/starter/sht31/include/sht31.h#define SHT31_ADDR"
  - topic: "16-bit commands"
    datasheet: "There are no registers to select: the host writes a 16-bit command, most significant byte first."
    source: "sht3x-ds §4.3, p. 10"
    status: modelled
    model: "devices/SHT31.cs#var command = (data[0] << 8) | data[1];"
    driver: "templates/starter/sht31/src/sht31.c#static i2c_status_t send_command"
  - topic: "Single-shot measurement"
    datasheet: "0x2400 (high), 0x240B (medium) and 0x2416 (low repeatability) start one measurement without clock stretching; 0x2C06, 0x2C0D and 0x2C10 start it with clock stretching."
    source: "sht3x-ds §4.3, Table 9, p. 10"
    corroborated_by: [sensirion-driver]
    status: modelled
    model: "devices/SHT31.cs#HighCommands = {"
    driver: "templates/starter/sht31/include/sht31.h#define SHT31_CMD_MEASURE_HIGH"
    test: "templates/starter/sht31/test/test_sht31.c#test_sht31_measures_temperature_and_humidity"
    note: "The medium code was wrong in the first version of the model. Sensirion's own driver (examples/sensirion-sht3x) found it."
  - topic: "Result layout"
    datasheet: "Six bytes: temperature (2 bytes) and its CRC, humidity (2 bytes) and its CRC."
    source: "sht3x-ds §4.4, p. 10"
    status: modelled
    model: "devices/SHT31.cs#return new[] { a[0], a[1], a[2], b[0], b[1], b[2] };"
    driver: "templates/starter/sht31/src/sht31.c#uint8_t raw[6];"
  - topic: "Temperature formula"
    datasheet: "T in °C = −45 + 175 × raw / 65535."
    source: "sht3x-ds §4.13, p. 14"
    status: modelled
    model: "devices/SHT31.cs#(Temperature + 45m) * 65535m / 175m"
    driver: "templates/starter/sht31/src/sht31.c#-45 + 175 * raw / 65535"
    test: "templates/starter/sht31/test/test_sht31.c#test_sht31_measures_below_zero_and_at_the_humidity_limits"
  - topic: "Humidity formula"
    datasheet: "RH in % = 100 × raw / 65535."
    source: "sht3x-ds §4.13, p. 14"
    status: modelled
    model: "devices/SHT31.cs#Humidity * 65535m / 100m"
    driver: "templates/starter/sht31/src/sht31.c#100 * raw / 65535"
    test: "templates/starter/sht31/test/test_sht31.c#test_sht31_measures_below_zero_and_at_the_humidity_limits"
  - topic: "CRC-8"
    datasheet: "Polynomial 0x31, initial value 0xFF, over the two data bytes. The datasheet's example: CRC of 0xBEEF is 0x92."
    source: "sht3x-ds §4.12, Table 20, p. 14"
    status: modelled
    model: "devices/SHT31.cs#private static byte Crc8"
    driver: "templates/starter/sht31/src/sht31.c#uint8_t sht31_crc8"
    test: "templates/starter/sht31/test/test_sht31.c#test_sht31_crc_matches_the_datasheet_example"
  - topic: "Status register"
    datasheet: "Command 0xF32D returns the 16-bit status and its CRC. It reads 0x8010 after a reset (alert pending, reset detected)."
    source: "sht3x-ds §4.11, p. 13"
    status: modelled
    model: "devices/SHT31.cs#status = 0x8010;"
    driver: "templates/starter/sht31/include/sht31.h#define SHT31_CMD_STATUS"
    test: "templates/starter/sht31/test/test_sht31.c#test_sht31_reports_a_reset_and_clears_it"
  - topic: "Clear status"
    datasheet: "Command 0x3041 clears bits 15, 11, 10 and 4 of the status register."
    source: "sht3x-ds §4.11, Table 19, p. 13"
    status: modelled
    model: "devices/SHT31.cs#status &= ~0x8C10;"
    driver: "templates/starter/sht31/src/sht31.c#sht31_status_t sht31_clear_status"
    test: "templates/starter/sht31/test/test_sht31.c#test_sht31_reports_a_reset_and_clears_it"
  - topic: "Soft reset"
    datasheet: "Command 0x30A2 resets the chip."
    source: "sht3x-ds §4.9, Table 14, p. 12"
    status: modelled
    model: "devices/SHT31.cs#case 0x30A2:"
    driver: "templates/starter/sht31/include/sht31.h#define SHT31_CMD_SOFT_RESET"
    test: "templates/starter/sht31/test/test_sht31.c#test_sht31_reports_a_reset_and_clears_it"
  - topic: "Corrupted result"
    datasheet: "(Not in the datasheet.) A noisy bus delivers a result whose CRC does not match."
    source: "n/a behaviour of a failed or absent part, not a statement of the document"
    status: modelled
    model: "devices/SHT31.cs#public bool CorruptCrc"
    driver: "templates/starter/sht31/src/sht31.c#return SHT31_ERR_CRC;"
    test: "templates/starter/sht31/test/test_sht31.c#test_sht31_rejects_a_result_with_a_bad_checksum"
    note: "VirtuLab fault injection: CorruptCrc true."
  - topic: "Measurement time"
    datasheet: "A measurement takes up to 15.5 ms (high repeatability), 6.5 ms (medium) or 4.5 ms (low). Without clock stretching the chip does not acknowledge a read before it is done."
    source: "sht3x-ds §2, p. 7"
    issue: "Two tables: 2.4 to 5.5 V gives 4, 6 and 15 ms maximum (Table 4), 2.15 to 2.4 V gives 4.5, 6.5 and 15.5 ms (Table 5). The model uses Table 5, the worst case."
    status: simplified
    model: "devices/SHT31.cs#public decimal ConversionTime"
    driver: "templates/starter/sht31/include/sht31.h#define SHT31_CONVERSION_MS"
    test: "templates/starter/sht31/test/test_sht31.c#test_sht31_result_is_not_ready_before_the_conversion_time"
    note: "Measured on the emulator's virtual clock, so the firmware's SysTick delay and the chip agree. ConversionTime is the high-repeatability time; medium and low scale with it. An early read gets 0xFF bytes, not the NACK a real chip gives."
  - topic: "Driver gives up on a chip that never finishes"
    datasheet: "(Not in the datasheet.) A chip that is damaged or not powered never produces a result."
    source: "n/a behaviour of a failed or absent part, not a statement of the document"
    status: modelled
    model: "devices/SHT31.cs#Now >= availableAt"
    driver: "templates/starter/sht31/src/sht31.c#SHT31_POLL_LIMIT_MS"
    test: "templates/starter/sht31/test/test_sht31.c#test_sht31_gives_up_when_the_chip_never_finishes"
    note: "VirtuLab fault injection: ConversionTime set far beyond the datasheet maximum."
  - topic: "Clock stretching"
    datasheet: "With commands 0x2C06, 0x2C0D and 0x2C10 the chip holds the clock line low until the result is ready."
    source: "sht3x-ds §4.4, p. 10"
    status: simplified
    model: "devices/SHT31.cs#var clockStretching = (command & 0xFF00) == 0x2C00;"
    note: "The emulator cannot stretch the clock, so the result is available at once and the waiting time is not charged."
  - topic: "Periodic measurement"
    datasheet: "Commands 0x20xx to 0x27xx start measurements at 0.5, 1, 2, 4 or 10 per second; 0xE000 fetches the latest result, once; 0x3093 stops."
    source: "sht3x-ds §4.5 to §4.8, 11 and 13, p. 11"
    status: modelled
    model: "devices/SHT31.cs#PeriodicCommands ="
    note: "Checked with Sensirion's driver (examples/sensirion-sht3x). The first result comes one conversion time after the start command."
  - topic: "Heater"
    datasheet: "Commands 0x306D and 0x3066 switch the heater; status bit 13 shows its state."
    source: "sht3x-ds §4.10, Table 16, §4.11, Table 18, p. 13"
    status: simplified
    model: "devices/SHT31.cs#private const int HeaterBit = 0x2000;"
    note: "Only the status bit; the heater does not change the readings."
  - topic: "Alert limits, ART mode and the other status bits"
    datasheet: "High and low alert thresholds, the accelerated response time mode and the remaining status flags."
    source: "sht3x-ds §4.7, p. 11"
    status: not-modelled
