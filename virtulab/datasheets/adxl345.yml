part: "ADXL345"
manufacturer: "Analog Devices"
title: "Analog Devices ADXL345 3-axis accelerometer"
document: "ADXL345 datasheet, Rev. G (search 'ADXL345' on analog.com), register map and SPI sections"
product_page: "https://www.analog.com/en/products/adxl345.html"
interface: "SPI 4-wire (mode 3: clock idles high, data sampled on the second edge). The chip also has an I²C interface, not modelled."
rows:
  - topic: "Device ID"
    datasheet: "Register 0x00 (DEVID) reads 0xE5."
    status: modelled
    model: "devices/ADXL345.cs#return 0xE5;"
    driver: "templates/starter/adxl345/include/adxl345.h#ADXL345_DEVICE_ID"
    test: "templates/starter/adxl345/test/test_adxl345.c#test_adxl345_reports_its_device_id"
  - topic: "SPI command byte"
    datasheet: "The first byte of a transaction: bit 7 is read (1) or write (0), bit 6 is multiple-byte, bits 5 to 0 are the register address."
    status: modelled
    model: "devices/ADXL345.cs#reading = (data & 0x80) != 0;"
    driver: "templates/starter/adxl345/src/adxl345.c#define READ_BIT"
    test: "templates/starter/adxl345/test/test_adxl345.c#test_adxl345_measures_gravity_on_the_z_axis"
  - topic: "Multiple-byte transfers"
    datasheet: "With the multiple-byte bit set the register address increments after each byte, so one transaction reads all six data bytes."
    status: modelled
    model: "devices/ADXL345.cs#multiple = (data & 0x40) != 0;"
    driver: "templates/starter/adxl345/src/adxl345.c#define MULTI_BIT"
    test: "templates/starter/adxl345/test/test_adxl345.c#test_adxl345_measures_gravity_on_the_z_axis"
  - topic: "Chip select ends a transaction"
    datasheet: "CS low starts a transaction and CS high ends it; the next byte after CS goes low is a command byte."
    status: modelled
    model: "devices/ADXL345.cs#public void FinishTransmission()"
    driver: "templates/starter/spi/src/spi.c#cs_set(dev, 0);"
    note: "In the emulator a multiplexer turns the chip-select pin into this call."
  - topic: "Data registers"
    datasheet: "DATAX0 to DATAZ1 (0x32 to 0x37): each axis is a 16-bit two's complement value, low byte first."
    status: modelled
    model: "devices/ADXL345.cs#private byte DataByte(int index)"
    driver: "templates/starter/adxl345/src/adxl345.c#define REG_DATAX0"
    test: "templates/starter/adxl345/test/test_adxl345.c#test_adxl345_reports_negative_acceleration"
  - topic: "Scale"
    datasheet: "Full-resolution mode gives 256 counts per g at every range. Otherwise the output is 10 bits with 256, 128, 64 or 32 counts per g for ±2, ±4, ±8 and ±16 g."
    status: modelled
    model: "devices/ADXL345.cs#256 >> range"
    driver: "templates/starter/adxl345/src/adxl345.c#define COUNTS_PER_G"
    test: "templates/starter/adxl345/test/test_adxl345.c#test_adxl345_measures_gravity_on_the_z_axis"
  - topic: "Data format register"
    datasheet: "DATA_FORMAT (0x31): bit 3 FULL_RES, bits 1 and 0 the range."
    status: modelled
    model: "devices/ADXL345.cs#var fullResolution"
    driver: "templates/starter/adxl345/src/adxl345.c#define DATA_FORMAT_FULL_RES"
  - topic: "Measurement mode"
    datasheet: "POWER_CTL (0x2D) bit 3 (Measure) turns measurement on; the chip powers up in standby."
    status: simplified
    model: "devices/ADXL345.cs#private const byte MeasureBit"
    driver: "templates/starter/adxl345/src/adxl345.c#define POWER_CTL_MEASURE"
    note: "Data reads as zero until Measure is set. What the real chip returns in standby is not modelled."
  - topic: "Read-only registers"
    datasheet: "DEVID and the data registers cannot be written."
    status: modelled
    model: "devices/ADXL345.cs#Write to read-only register"
  - topic: "Output data rate"
    datasheet: "BW_RATE (0x2C) resets to 0x0A (100 Hz) and sets how often new data appears."
    status: simplified
    model: "devices/ADXL345.cs#registers[BwRate] = 0x0A;"
    note: "The reset value is right, the rate itself has no effect: data is always current."
  - topic: "Not connected"
    datasheet: "(Not in the datasheet.) A disconnected sensor leaves the MISO line high, so every byte reads 0xFF."
    status: modelled
    model: "devices/ADXL345.cs#public bool Responding"
    driver: "templates/starter/adxl345/src/adxl345.c#return ADXL345_ERR_ID;"
    test: "templates/starter/adxl345/test/test_adxl345.c#test_adxl345_disconnected_sensor_is_detected"
    note: "VirtuLab fault injection: vl_sim with Responding false."
  - topic: "SPI mode"
    datasheet: "The chip needs mode 3 (clock polarity 1, phase 1)."
    status: not-modelled
    driver: "templates/starter/adxl345/include/adxl345.h#define ADXL345_CS"
    note: "The sample driver asks for mode 3, but the emulator does not check the mode, so a driver with the wrong mode still passes."
  - topic: "Offset, threshold, tap, activity and free-fall registers"
    datasheet: "Registers 0x1D to 0x2B configure offsets and the detection engines."
    status: not-modelled
    note: "They store what is written and do nothing."
  - topic: "Interrupts, FIFO and self-test"
    datasheet: "INT1 and INT2 pins, a 32-sample FIFO and a self-test force."
    status: not-modelled
